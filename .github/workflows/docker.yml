name: Docker Build & Publish

on:
  push:
    # (#21) Triggers normalized to project integration branches plus main
    branches: [master, test]
    tags: ['v*']
  pull_request:
    branches: [master, test]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a tag build - that is a publish in flight
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ufal/atrium-project/.github/workflows/docker-tool.reusable.yml@test
    secrets:
      # Explicit instead of `secrets: inherit` — the reusable declares and
      # needs only this one (#18). inherit handed it every repo secret.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      image-name: ufal/atrium-alto-postprocess
      apt-packages: build-essential g++
      # Mirrors this repo's own constraint in setup/requirements.txt. A bare
      # `torch` resolved to whatever the CPU index served that day, so the
      # pre-install and the manifest could disagree run to run (#18).
      pre-install-torch: "torch>=2.1,<3.0"
      requirements: setup/requirements.txt service/requirements.txt setup/requirements-test.txt
